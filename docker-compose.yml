# Local PostgreSQL for the ProcessLink demo.
# Matches the DATABASE_URL in .env.example, so no editing is needed.
services:
  db:
    image: postgres:16
    container_name: processlink-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: processlink
    ports:
      - "5432:5432"
    volumes:
      - processlink-data:/var/lib/postgresql/data
volumes:
  processlink-data:
